site_name: AICS Learning Guide
site_url: https://george-102.github.io/AICS_Learning_Guide/
site_author: Christopher Chang
site_description: a guide for learning AICS

repo_name: AICS_Learning_Guide
repo_url: https://github.com/George-102/AICS_Learning_Guide

copyright: Copyright &copy; 2026-present <a href="https://github.com/George-102" target="_blank" rel="noopener noreferrer">Christopher Chang</a>

theme:
  name: material
  custom_dir: overrides  
  language: zh
  static_templates:
    - 404.html
  favicon: images/favicon.svg
  logo: images/favicon.svg
  apple-touch-icon-precomposed: images/favicon.svg
  include_search_page: false
  search_index_only: true

  features:
    - header.autohide
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - content.tabs.link
    - content.image.lightbox
    - content.image.zoom
    - content.image.caption
    - announce.dismiss
    - comments

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: 'deep purple'
      accent: 'indigo'
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: 'deep purple'
      accent: 'pink'
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github # 右上角 GitHub 链接按钮的图标
    previous: material/arrow-left-circle # 自定义“上一页”图标
    next: material/arrow-right-circle # 自定义“下一页”图标
    search: material/magnify
    share: material/share-variant
    close: material/close
    menu: material/menu
    top: material/arrow-up

  # 如果没有 overrides 文件夹，删除下面这行或注释掉
  # custom_dir: overrides

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.keys
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

plugins:
  - i18n:
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
        - locale: en
          name: English
          build: true
          site_name: AI-CS Learning Guide
