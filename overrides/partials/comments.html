<script>
    (function () {
        const paletteInputs = () =>
            Array.from(document.querySelectorAll('[data-md-component="palette"] input[data-md-color-media]'));

        const prefersDark = () => {
            const inputs = paletteInputs();
            const stored = typeof window.__md_get === 'function' ? __md_get('__palette') : null;
            const index = stored && typeof stored.index === 'number'
                ? stored.index
                : inputs.findIndex(input => matchMedia(input.getAttribute('data-md-color-media')).matches);
            const input = inputs[index];
            if (input) return input.getAttribute('data-md-color-scheme') === 'slate';
            return document.body.getAttribute('data-md-color-scheme') === 'slate';
        };

        const giscusTheme = () => (prefersDark() ? 'dark' : 'light');

        const attrs = {
            'data-repo': 'George-102/AICS_Learning_Guide',
            'data-repo-id': 'R_kgDOVgPv1Q',
            'data-category': 'Announcements',
            'data-category-id': 'DIC_kwDOVgPv1c4DKOYp',
            'data-mapping': 'pathname',
            'data-strict': '0',
            'data-reactions-enabled': '1',
            'data-emit-metadata': '0',
            'data-input-position': 'bottom',
            'data-theme': giscusTheme(),
            'data-lang': 'zh-CN'
        };

        const script = document.createElement('script');
        script.src = 'https://giscus.app/client.js';
        script.async = true;
        script.crossOrigin = 'anonymous';
        Object.entries(attrs).forEach(([key, value]) => script.setAttribute(key, value));
        document.currentScript.parentElement.appendChild(script);

        let frame = null;

        const applyTheme = () => {
            if (!frame || !frame.contentWindow) return;
            frame.contentWindow.postMessage(
                { giscus: { setConfig: { theme: giscusTheme() } } },
                'https://giscus.app'
            );
        };

        const frameObserver = new MutationObserver((mutations, obs) => {
            const el = document.querySelector('iframe.giscus-frame');
            if (!el) return;
            frame = el;
            frame.addEventListener('load', applyTheme);
            applyTheme();
            obs.disconnect();
        });
        frameObserver.observe(document.body, { childList: true, subtree: true });

        new MutationObserver(applyTheme).observe(document.body, {
            attributes: true,
            attributeFilter: ['data-md-color-scheme']
        });
    })();
</script>
